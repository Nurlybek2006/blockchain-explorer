server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/storage-wal
    local:
      path: /var/tempo/blocks

backend_worker:
  backend_scheduler_addr: 127.0.0.1:9095
  compaction:
    block_retention: 168h

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h

usage_report:
  reporting_enabled: false

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9095

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    span_metrics:
      intrinsic_dimensions:
        service: true
        span_name: false
        span_kind: true
        status_code: true
    service_graphs:
      enable_virtual_node_label: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
