# Overlay: same production project/network, separate durable monitoring volumes.
# docker compose --env-file .env.production -f infrastructure/compose.production.yml -f infrastructure/compose.production.observability.yml up -d
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yml"]
    restart: unless-stopped
    mem_limit: 512m
    volumes: ["./monitoring/otel-collector/config.yml:/etc/otelcol/config.yml:ro"]
    depends_on: [tempo, loki]
    logging: &bounded-logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *bounded-logs

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yml"]
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    logging: *bounded-logs

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo/config.yml", "-target=all"]
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./monitoring/tempo/tempo-config.yml:/etc/tempo/config.yml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: [CMD, /tempo, -health]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *bounded-logs

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    mem_limit: 512m
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_SERVER_ROOT_URL: http://localhost:${PROD_GRAFANA_PORT:-3004}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:${PROD_GRAFANA_PORT:-3004}:3000"]
    depends_on: [prometheus, loki, tempo]
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *bounded-logs

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
